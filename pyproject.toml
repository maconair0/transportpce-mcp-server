[project]
name = "transportpce-mcp-server"
version = "0.1.0"
description = "MCP server for the OpenDaylight TransportPCE optical SDN controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=1.5.0", "httpx>=0.28.1"]

[project.scripts]
transportpce-mcp = "run_transportpce_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transportpce_mcp"]
